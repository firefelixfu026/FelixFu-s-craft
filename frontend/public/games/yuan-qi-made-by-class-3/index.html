<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元气 - 策略对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app-shell">
        <section id="home-screen" class="screen home-screen active">
            <div class="hero-panel">
                <p class="eyebrow">Yuan Qi Battle</p>
                <h1>元气</h1>
                <p>选择模式，攒元气，读对手技能，在同一回合里打出更强攻击。</p>
            </div>

            <div class="mode-grid">
                <button class="mode-card primary" data-start-mode="normal">
                    <span>普通模式</span>
                    <strong>连续对战</strong>
                    <em>可调整局数、人数和 AI 强度。</em>
                </button>
                <button class="mode-card" data-start-mode="timed">
                    <span>限时模式</span>
                    <strong>倒计时出招</strong>
                    <em>每回合限时，时间到没出招就失败。</em>
                </button>
                <button class="mode-card locked" id="crisis-mode">
                    <span>危机合约</span>
                    <strong>正在制作中</strong>
                    <em>未来加入特殊限制、词条和高难挑战。</em>
                </button>
            </div>

            <div class="home-actions">
                <button id="open-settings" class="secondary-action">设置</button>
                <button id="quick-start" class="primary-action">开始普通模式</button>
            </div>
        </section>

        <section id="settings-screen" class="screen settings-screen">
            <div class="screen-heading">
                <button class="text-button" data-go-home>返回首页</button>
                <h1>模式设置</h1>
            </div>

            <div class="settings-grid">
                <label>
                    <span>普通模式局数</span>
                    <input id="setting-rounds" type="number" min="1" max="9" value="3">
                </label>
                <label>
                    <span>对战人数</span>
                    <select id="setting-players">
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                    </select>
                </label>
                <label>
                    <span>AI 强度</span>
                    <select id="setting-ai">
                        <option value="easy">简单</option>
                        <option value="normal" selected>普通</option>
                        <option value="hard">困难</option>
                    </select>
                </label>
                <label>
                    <span>限时模式每回合秒数</span>
                    <input id="setting-timer" type="number" min="3" max="60" value="10">
                </label>
            </div>

            <div class="settings-note">
                <strong>多人对战雏形</strong>
                <p>现在会把 1 名玩家和若干 AI 放进同一场。后面如果做双人或多人联机，可以把“出招选择”改成等待每个玩家提交，再统一结算。</p>
            </div>

            <div class="home-actions">
                <button class="secondary-action" data-go-home>保存并返回</button>
                <button class="primary-action" data-start-mode="normal">按设置开始</button>
            </div>
        </section>

        <section id="battle-screen" class="screen battle-screen">
            <div class="battle-topbar">
                <div>
                    <p class="eyebrow" id="mode-label">普通模式</p>
                    <h1 id="battle-title">第 1 局</h1>
                </div>
                <div class="battle-actions">
                    <span id="timer-pill" class="timer-pill hidden">10s</span>
                    <button class="secondary-action" id="back-home">首页</button>
                    <button class="secondary-action" id="restart-match">重开</button>
                </div>
            </div>

            <div class="score-row" id="score-row"></div>
            <div class="fighters-grid" id="fighters-grid"></div>

            <section class="round-panel">
                <div class="round-info" id="round-status">请选择技能</div>
                <div class="skill-buttons" id="skill-buttons"></div>
            </section>
        </section>
    </main>

    <script src="js/game.js"></script>
</body>
</html>
