name: Data recovery audit

on:
  push:
    branches:
      - codex/data-recovery-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only production data audit
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/felixfu_deploy_key
          chmod 600 ~/.ssh/felixfu_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production without changing it
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/felixfu_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s" > audit.txt <<'REMOTE'
          set -u
          echo "AUDIT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "HOST=$(hostname)"

          echo "--- ACTIVE_POSTGRES ---"
          docker inspect felixfu_blog_postgres \
            --format 'status={{.State.Status}} started={{.State.StartedAt}}{{range .Mounts}} mount={{.Name}}:{{.Destination}}{{end}}' 2>&1 || true

          echo "--- DATABASE_COUNTS ---"
          docker exec -i felixfu_blog_postgres psql -U felix_blog -d felix_blog -At -F '=' <<'SQL' 2>&1 || true
          SELECT 'articles', COUNT(*)::text FROM articles;
          SELECT 'published_articles', COUNT(*)::text FROM articles WHERE status = 'published';
          SELECT 'draft_articles', COUNT(*)::text FROM articles WHERE status = 'draft';
          SELECT 'total_views', COALESCE(SUM(view_count), 0)::text FROM articles;
          SELECT 'latest_article_update', COALESCE(MAX(updated_at)::text, 'none') FROM articles;
          SELECT 'reaction_rows', COUNT(*)::text FROM reaction_counters;
          SELECT 'reaction_total', COALESCE(SUM(count), 0)::text FROM reaction_counters;
          SELECT 'user_reactions', COUNT(*)::text FROM user_reactions;
          SELECT 'comments', COUNT(*)::text FROM comments;
          SELECT 'reaction_reset_marker', COUNT(*)::text FROM schema_migrations WHERE name = 'reset_reactions_v1_2_3';
          SQL

          echo "--- LATEST_ARTICLES ---"
          docker exec felixfu_blog_postgres psql -U felix_blog -d felix_blog -At -F ' | ' \
            -c "SELECT id, title, status, view_count, date, updated_at FROM articles ORDER BY updated_at DESC NULLS LAST LIMIT 12" 2>&1 || true

          echo "--- RELATED_VOLUMES ---"
          docker volume ls --format '{{.Name}}' | grep -Ei 'felix|blog|postgres|pgdata' || true

          echo "--- VOLUME_DETAILS ---"
          for volume in $(docker volume ls --format '{{.Name}}' | grep -Ei 'felix|blog|postgres|pgdata' || true); do
            docker volume inspect "$volume" --format 'name={{.Name}} created={{.CreatedAt}} mountpoint={{.Mountpoint}}' 2>&1 || true
          done

          echo "--- POSSIBLE_BACKUPS ---"
          find /opt -maxdepth 6 -type f \
            \( -iname '*.sql' -o -iname '*.sql.gz' -o -iname '*backup*' -o -iname '*postgres*.tar*' -o -iname '*pgdata*.tar*' \) \
            -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort -r | head -n 40 || true

          echo "--- OLD_BACKUP_COUNTS ---"
          backup=/opt/felixfu-blog/backups-from-old/postgres/felix_blog_20260902_184618.sql.gz
          if [ -r "$backup" ]; then
            if gzip -t "$backup"; then
              echo "backup_gzip_integrity=ok"
            else
              echo "backup_gzip_integrity=failed"
            fi
            gzip -cd "$backup" | awk '
              /^COPY public\.(articles|reaction_counters|user_reactions|comments|schema_migrations) / {
                table_name=$2
                sub(/^public\./, "", table_name)
                active=table_name
                next
              }
              active != "" && $0 == "\\." { active=""; next }
              active != "" { counts[active]++ }
              END {
                print "backup_articles=" (counts["articles"] + 0)
                print "backup_reaction_rows=" (counts["reaction_counters"] + 0)
                print "backup_user_reactions=" (counts["user_reactions"] + 0)
                print "backup_comments=" (counts["comments"] + 0)
                print "backup_schema_migrations=" (counts["schema_migrations"] + 0)
              }
            '
            if gzip -cd "$backup" | grep -q 'reset_reactions_v1_2_3'; then
              echo "backup_has_reaction_reset_marker=yes"
            else
              echo "backup_has_reaction_reset_marker=no"
            fi

            gzip -cd "$backup" | awk -F '\t' '
              /^COPY public\.articles / { active=1; next }
              active && $0 == "\\." { active=0; next }
              active {
                print "backup_article=" $1 " | " $2 " | status=" $8 " | views=" $14 " | date=" $6
                total_views += $14
              }
              END { print "backup_total_views=" (total_views + 0) }
            '

            gzip -cd "$backup" | awk -F '\t' '
              /^COPY public\.reaction_counters / { active=1; next }
              active && $0 == "\\." { active=0; next }
              active { reaction_total += $4 }
              END { print "backup_reaction_total=" (reaction_total + 0) }
            '
          else
            echo "old_backup_unreadable"
          fi

          echo "--- OLD_BACKUP_INVENTORY ---"
          find /opt/felixfu-blog/backups-from-old -maxdepth 5 -type f \
            -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null | sort -r || true

          echo "--- ACTIVE_VOLUME_USAGE ---"
          du -sh /var/lib/docker/volumes/felixfu-blog_postgres_data/_data \
            /var/lib/docker/volumes/felixfu-blog_uploads_data/_data \
            /var/lib/docker/volumes/felixfu-blog_backend_data/_data 2>&1 || true

          echo "--- TEMP_RESTORE_VALIDATION ---"
          (
            set -e
            check_container="felixfu_restore_check_$$"
            trap 'docker rm -f "$check_container" >/dev/null 2>&1 || true' EXIT
            docker run --rm -d --name "$check_container" \
              --tmpfs /var/lib/postgresql/data:rw,size=256m \
              -e POSTGRES_USER=felix_blog \
              -e POSTGRES_PASSWORD=recovery-check-only \
              -e POSTGRES_DB=felix_blog \
              postgres:16-alpine >/dev/null

            for attempt in $(seq 1 30); do
              if docker exec "$check_container" pg_isready -U felix_blog -d felix_blog >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "temporary_postgres_not_ready"
                exit 1
              fi
              sleep 1
            done

            gzip -cd "$backup" | docker exec -i "$check_container" \
              psql -v ON_ERROR_STOP=1 -U felix_blog -d felix_blog >/dev/null
            echo "temporary_restore=ok"
            docker exec -i "$check_container" psql -U felix_blog -d felix_blog -At -F '=' <<'SQL_CHECK'
          SELECT 'restored_articles', COUNT(*)::text FROM articles;
          SELECT 'restored_published_articles', COUNT(*)::text FROM articles WHERE status = 'published';
          SELECT 'restored_draft_articles', COUNT(*)::text FROM articles WHERE status = 'draft';
          SELECT 'restored_total_views', COALESCE(SUM(view_count), 0)::text FROM articles;
          SELECT 'restored_reaction_rows', COUNT(*)::text FROM reaction_counters;
          SELECT 'restored_reaction_total', COALESCE(SUM(count), 0)::text FROM reaction_counters;
          SELECT 'restored_user_reactions', COUNT(*)::text FROM user_reactions;
          SELECT 'restored_comments', COUNT(*)::text FROM comments;
          SELECT 'restored_users', COUNT(*)::text FROM users;
          SELECT 'restored_reset_marker', COUNT(*)::text FROM schema_migrations WHERE name = 'reset_reactions_v1_2_3';
          SQL_CHECK

            docker exec "$check_container" psql -U felix_blog -d felix_blog -At -F ' | ' \
              -c "SELECT id, title, status, view_count, date, updated_at FROM articles ORDER BY updated_at DESC NULLS LAST" 2>&1
          ) 2>&1 || echo "temporary_restore=failed"
          REMOTE

          cat audit.txt
          {
            echo '## Read-only production data audit'
            echo '```text'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          compact="$(tr '\n' ';' < audit.txt | cut -c1-6000)"
          echo "::notice title=Production data audit::$compact"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: production-data-audit
          path: audit.txt
          retention-days: 3
