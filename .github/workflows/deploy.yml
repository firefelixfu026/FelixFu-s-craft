name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/felixfu-blog' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Validate deployment secrets
        run: |
          test -n "$DEPLOY_HOST" || (echo "DEPLOY_HOST is required" && exit 1)
          test -n "$DEPLOY_USER" || (echo "DEPLOY_USER is required" && exit 1)
          test -n "$DEPLOY_SSH_KEY" || (echo "DEPLOY_SSH_KEY is required" && exit 1)

      - name: Build deployment bundle
        run: |
          git branch -f codex-deploy-source "$DEPLOY_SHA"
          git bundle create felixfu-main.bundle refs/heads/codex-deploy-source
          git bundle verify felixfu-main.bundle

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/felixfu_deploy_key
          chmod 600 ~/.ssh/felixfu_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Check SSH connection
        run: |
          nc -vz -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/felixfu_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo ssh-ok"

      - name: Deploy on server
        run: |
          bundle_path="/tmp/felixfu-main-${DEPLOY_SHA}.bundle"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/felixfu_deploy_key -P "$DEPLOY_PORT" felixfu-main.bundle \
            "$DEPLOY_USER@$DEPLOY_HOST:$bundle_path"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i ~/.ssh/felixfu_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' BUNDLE_PATH='$bundle_path' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "$BUNDLE_PATH"' EXIT
          cd "$DEPLOY_PATH"

          if [ -n "$(git -c core.fileMode=false status --porcelain --untracked-files=no)" ]; then
            echo "Tracked files on the server contain local changes; refusing to overwrite them." >&2
            exit 1
          fi

          git -c core.fileMode=false fetch "$BUNDLE_PATH" refs/heads/codex-deploy-source
          git -c core.fileMode=false merge --ff-only FETCH_HEAD
          SKIP_GIT_PULL=1 bash scripts/deploy-production.sh
          REMOTE
